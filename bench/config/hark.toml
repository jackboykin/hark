[server]
listen = ["127.0.0.1:5354"]

[resolver]
# One address, as the peers read from root.hints.
root-hints = ["198.41.0.4"]
@!SIGNED dnssec = false
@SIGNED dnssec = true
@SIGNED trust-anchors = ["__DS__"]
qname-minimization = false

[cache]
size = 268435456

[logging]
queries = false

[rebinding]
allow-zones = ["bench"]
