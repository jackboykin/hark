server:
    interface: 127.0.0.1@5354
    num-threads: __N__
    so-reuseport: yes
    do-ip6: no
    username: ""
    chroot: ""
    directory: "__RUN__"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 0
    root-hints: "__DIR__/root.hints"
@!SIGNED     module-config: "iterator"
@SIGNED     module-config: "validator iterator"
@SIGNED     trust-anchor: ". DS __DS__"
@SIGNED @!SYNTH     aggressive-nsec: no
    qname-minimisation: no
    msg-cache-size: 128m
    rrset-cache-size: 256m
    so-rcvbuf: 4m
    so-sndbuf: 4m
    outgoing-range: 4096
    num-queries-per-thread: 4096
    minimal-responses: yes
    access-control: 127.0.0.0/8 allow
