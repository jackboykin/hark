options {
    directory "__RUN__";
    listen-on port 5354 { 127.0.0.1; };
    listen-on-v6 { none; };
    udp-receive-buffer 4194304;
    udp-send-buffer 4194304;
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
@!SIGNED     dnssec-validation no;
@SIGNED     dnssec-validation yes;
@SIGNED @!SYNTH     synth-from-dnssec no;
    qname-minimization off;
    max-cache-size 256m;
    pid-file none;
    minimal-responses yes;
};
@SIGNED trust-anchors { "." static-ds __DS_QUOTED__; };
zone "." { type hint; file "__DIR__/root.hints"; };
