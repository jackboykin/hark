# Unbound configured to mirror hark.toml for OTHER_RESOLVER comparisons.
#   mkdir -p /tmp/hark-unbound && unbound-anchor -a /tmp/hark-unbound/root.key
#   unbound -c bench/recursion/unbound.conf
server:
  interface: 127.0.0.1
  port: 5355
  num-threads: 4
  do-daemonize: no
  use-syslog: no
  logfile: ""
  verbosity: 0
  directory: /tmp/hark-unbound
  chroot: ""
  username: ""
  pidfile: ""
  access-control: 127.0.0.0/8 allow
  qname-minimisation: yes
  auto-trust-anchor-file: root.key
  msg-cache-size: 128m
  rrset-cache-size: 128m
  so-reuseport: yes
  outgoing-range: 4096
  num-queries-per-thread: 2048
remote-control:
  control-enable: no
