[pytest]
testpaths = scenarios harness differential
pythonpath = .
python_files = test_*.py
addopts = -ra --tb=short
# Bound any scenario at 30s wall clock — a hung hark or stuck responder
# would otherwise block pytest indefinitely (typical scenario runs <1s; the
# differential test is the slowest at ~10s). Override per-test with
# `@pytest.mark.timeout(N)` if a future scenario legitimately needs longer.
timeout = 30
