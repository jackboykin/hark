[pytest]
testpaths = scenarios harness
pythonpath = .
python_files = test_*.py
# A file per worker: test_tcp_clients' idle timers flake when its tests
# race the whole suite for cores.
addopts = -ra --tb=short -n auto --dist loadfile
# Bound any scenario at 30s wall clock — a hung hark or stuck responder
# would otherwise block pytest indefinitely (typical scenario runs <1s).
# Override per-test with
# `@pytest.mark.timeout(N)` if a future scenario legitimately needs longer.
timeout = 30
